<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#312e81"/>
      <stop offset="50%" style="stop-color:#4338ca"/>
      <stop offset="100%" style="stop-color:#3730a3"/>
    </linearGradient>
    <!-- Accent gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#fbbf24"/>
      <stop offset="100%" style="stop-color:#f59e0b"/>
    </linearGradient>
    <!-- Green gradient for tree -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4ade80"/>
      <stop offset="100%" style="stop-color:#16a34a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- Decorative circles -->
  <circle cx="1050" cy="80" r="180" fill="rgba(255,255,255,0.03)"/>
  <circle cx="1100" cy="500" r="120" fill="rgba(255,255,255,0.03)"/>
  <circle cx="100" cy="550" r="150" fill="rgba(255,255,255,0.03)"/>
  <circle cx="150" cy="100" r="80" fill="rgba(255,255,255,0.03)"/>

  <!-- Dot grid pattern (right side) -->
  <g opacity="0.08">
    <circle cx="900" cy="100" r="3" fill="white"/> <circle cx="940" cy="100" r="3" fill="white"/> <circle cx="980" cy="100" r="3" fill="white"/> <circle cx="1020" cy="100" r="3" fill="white"/> <circle cx="1060" cy="100" r="3" fill="white"/>
    <circle cx="900" cy="140" r="3" fill="white"/> <circle cx="940" cy="140" r="3" fill="white"/> <circle cx="980" cy="140" r="3" fill="white"/> <circle cx="1020" cy="140" r="3" fill="white"/> <circle cx="1060" cy="140" r="3" fill="white"/>
    <circle cx="900" cy="180" r="3" fill="white"/> <circle cx="940" cy="180" r="3" fill="white"/> <circle cx="980" cy="180" r="3" fill="white"/> <circle cx="1020" cy="180" r="3" fill="white"/> <circle cx="1060" cy="180" r="3" fill="white"/>
    <circle cx="900" cy="220" r="3" fill="white"/> <circle cx="940" cy="220" r="3" fill="white"/> <circle cx="980" cy="220" r="3" fill="white"/> <circle cx="1020" cy="220" r="3" fill="white"/> <circle cx="1060" cy="220" r="3" fill="white"/>
    <circle cx="900" cy="260" r="3" fill="white"/> <circle cx="940" cy="260" r="3" fill="white"/> <circle cx="980" cy="260" r="3" fill="white"/> <circle cx="1020" cy="260" r="3" fill="white"/> <circle cx="1060" cy="260" r="3" fill="white"/>
  </g>

  <!-- Left accent bar -->
  <rect x="80" y="100" width="6" height="430" rx="3" fill="url(#accent)"/>

  <!-- LOGO mark (book + tree) at top left -->
  <g transform="translate(110, 108) scale(1.4)">
    <!-- Book base -->
    <path d="M5 36 Q5 42 11 44 L35 48 L59 44 Q65 42 65 36 L65 30 Q59 33 35 33 Q11 33 5 30 Z" fill="#6366f1"/>
    <!-- Left page -->
    <path d="M5 30 Q5 36 11 38 L35 41 L35 8 Q23 6 13 10 Q5 14 5 22 Z" fill="#818cf8"/>
    <!-- Right page -->
    <path d="M65 30 Q65 36 59 38 L35 41 L35 8 Q47 6 57 10 Q65 14 65 22 Z" fill="#a5b4fc"/>
    <!-- Spine -->
    <line x1="35" y1="8" x2="35" y2="41" stroke="#c7d2fe" stroke-width="1.5"/>
    <!-- Trunk -->
    <path d="M35 32 L35 16" stroke="#4338ca" stroke-width="3" stroke-linecap="round"/>
    <!-- Branches -->
    <path d="M35 26 Q27 22 23 16" stroke="#4338ca" stroke-width="2" stroke-linecap="round" fill="none"/>
    <path d="M35 24 Q43 19 47 13" stroke="#4338ca" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Leaves -->
    <ellipse cx="20" cy="13" rx="8" ry="6" fill="#22c55e" transform="rotate(-20 20 13)"/>
    <ellipse cx="15" cy="9" rx="6" ry="4" fill="#16a34a" transform="rotate(-35 15 9)"/>
    <ellipse cx="25" cy="9" rx="5" ry="3.5" fill="#4ade80" transform="rotate(-5 25 9)"/>
    <ellipse cx="50" cy="9" rx="8" ry="6" fill="#22c55e" transform="rotate(20 50 9)"/>
    <ellipse cx="55" cy="5" rx="6" ry="4" fill="#16a34a" transform="rotate(35 55 5)"/>
    <ellipse cx="45" cy="5" rx="5" ry="3.5" fill="#4ade80" transform="rotate(5 45 5)"/>
    <ellipse cx="35" cy="3" rx="7" ry="5" fill="#22c55e"/>
    <!-- Star -->
    <circle cx="35" cy="-3" r="3" fill="#fbbf24"/>
  </g>

  <!-- Company name -->
  <text x="222" y="148" font-family="'Helvetica Neue', Arial, sans-serif" font-size="28" font-weight="800" fill="white" letter-spacing="1">Elite Tech Solutions</text>
  <text x="222" y="175" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#a5b4fc" letter-spacing="3">TRAINING CENTER</text>

  <!-- FREE DEMO badge -->
  <rect x="110" y="210" width="180" height="38" rx="19" fill="url(#accent)" filter="url(#shadow)"/>
  <text x="200" y="234" font-family="'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="800" fill="#1e1b4b" text-anchor="middle" letter-spacing="2">🚀 FREE DEMO CLASS</text>

  <!-- Main headline -->
  <text x="110" y="320" font-family="'Helvetica Neue', Arial, sans-serif" font-size="58" font-weight="900" fill="white" letter-spacing="-1">Full-Stack Java</text>
  <text x="110" y="390" font-family="'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="900" fill="#fbbf24">Spring Boot + Angular</text>
  <text x="110" y="450" font-family="'Helvetica Neue', Arial, sans-serif" font-size="48" font-weight="900" fill="#a5b4fc">+ AI Integration</text>

  <!-- Divider line -->
  <rect x="110" y="478" width="700" height="2" rx="1" fill="rgba(255,255,255,0.15)"/>

  <!-- Event details row -->
  <!-- Date -->
  <rect x="110" y="500" width="200" height="60" rx="12" fill="rgba(255,255,255,0.08)"/>
  <text x="210" y="525" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc" text-anchor="middle" letter-spacing="2">DATE</text>
  <text x="210" y="548" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="white" text-anchor="middle">15th August 2026</text>

  <!-- Time -->
  <rect x="325" y="500" width="180" height="60" rx="12" fill="rgba(255,255,255,0.08)"/>
  <text x="415" y="525" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc" text-anchor="middle" letter-spacing="2">TIME</text>
  <text x="415" y="548" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="white" text-anchor="middle">7:00 PM IST</text>

  <!-- Mode -->
  <rect x="520" y="500" width="160" height="60" rx="12" fill="rgba(255,255,255,0.08)"/>
  <text x="600" y="525" font-family="'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="600" fill="#a5b4fc" text-anchor="middle" letter-spacing="2">MODE</text>
  <text x="600" y="548" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="800" fill="white" text-anchor="middle">Online (Free)</text>

  <!-- Right side — tech stack pills -->
  <g transform="translate(860, 260)">
    <!-- Java pill -->
    <rect x="0" y="0" width="140" height="44" rx="22" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="70" y="27" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">☕ Core Java</text>

    <!-- Spring Boot pill -->
    <rect x="0" y="60" width="160" height="44" rx="22" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="80" y="87" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">🍃 Spring Boot</text>

    <!-- Angular pill -->
    <rect x="0" y="120" width="140" height="44" rx="22" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="70" y="147" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">🅰 Angular</text>

    <!-- AI pill -->
    <rect x="0" y="180" width="140" height="44" rx="22" fill="rgba(255,255,255,0.15)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="70" y="207" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="#fbbf24" text-anchor="middle">🤖 AI Integration</text>

    <!-- Docker pill -->
    <rect x="0" y="240" width="140" height="44" rx="22" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
    <text x="70" y="267" font-family="'Helvetica Neue', Arial, sans-serif" font-size="16" font-weight="700" fill="white" text-anchor="middle">🐳 Docker</text>
  </g>

  <!-- Website URL at bottom -->
  <text x="600" y="610" font-family="'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="600" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="1">elitetechsolutions.co.in/demo</text>
</svg>
